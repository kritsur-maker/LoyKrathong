<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดูดวงออนไลน์แม่นๆ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        h1 {
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e2e8f0;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        input:focus, select:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        /* ส่วนผลลัพธ์คำนาย */
        .result-card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border-left: 5px solid #f1c40f;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-card h2 {
            color: #f1c40f;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .zodiac-badge {
            display: inline-block;
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid #f1c40f;
        }

        .fortune-item {
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 15px;
        }

        .fortune-item strong {
            color: #38bdf8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>🔮 ดูดวงชะตารายวัน 🔮</h1>

    <div class="container">
        <div class="form-group">
            <label for="name">ชื่อของคุณ:</label>
            <input type="text" id="name" placeholder="กรอกชื่อของคุณ" required>
        </div>

        <div class="form-group">
            <label for="gender">เพศ:</label>
            <select id="gender">
                <option value="ชาย">ชาย</option>
                <option value="หญิง">หญิง</option>
                <option value="LGBTQ+">LGBTQ+</option>
                <option value="ไม่ระบุ">ไม่ระบุ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="birthdate">วัน/เดือน/ปีเกิด:</label>
            <input type="date" id="birthdate" required>
        </div>

        <button onclick="predictFortune()">เปิดคำทำนาย</button>

        <!-- ผลลัพธ์ -->
        <div class="result-card" id="resultCard">
            <h2 id="resultTitle">คำทำนายดวงชะตา</h2>
            <div class="zodiac-badge" id="zodiacBadge">ราศี...</div>
            
            <div class="fortune-item">
                <strong>💼 การงาน / การเรียน:</strong>
                <p id="workFortune">-</p>
            </div>
            
            <div class="fortune-item">
                <strong>💰 การเงิน / โชคลาภ:</strong>
                <p id="moneyFortune">-</p>
            </div>
            
            <div class="fortune-item">
                <strong>❤️ ความรัก / ความสัมพันธ์:</strong>
                <p id="loveFortune">-</p>
            </div>
        </div>
    </div>

    <script>
        // ฐานข้อมูลคำทำนาย
        const fortunes = {
            work: [
                "ช่วงนี้ผู้ใหญ่ให้ความเมตตา งานประเดประดังแต่ผ่านไปได้ด้วยดี",
                "ระวังเรื่องการสื่อสารคลาดเคลื่อนกับเพื่อนร่วมงานหรือเพื่อนเรียน",
                "มีโอกาสได้รับไอเดียใหม่ๆ หรือโปรเจกต์ใหม่ที่จะสร้างชื่อเสียงให้คุณ",
                "เป็นช่วงที่ต้องใช้ความอดทนสูง ผลงานจะออกมารายงานผลในเร็วๆ นี้"
            ],
            money: [
                "มีเกณฑ์รับทรัพย์รับโชคจากเลขใกล้ตัว หรือลาภลอยแบบไม่คาดฝัน",
                "การเงินหมุนคล่องตัวดี แต่ควรระวังการใช้จ่ายตามอารมณ์ช่วงปลายสัปดาห์",
                "มีรายจ่ายกะทันหันเกี่ยวกับสุขภาพหรือของใช้ส่วนตัว งดลงทุนเสี่ยงโชคสูง",
                "โชคลาภมาจากคนใกล้ชิดหรือเพศตรงข้าม ให้คำแนะนำด้านการเงินที่ดี"
            ],
            love: [
                "คนมีคู่ความสัมพันธ์หวานชื่น คนโสดมีเกณฑ์พบคนถูกใจผ่านทางออนไลน์",
                "คนโสดเสน่ห์แรง มีคนเข้ามาให้เลือก แต่ต้องดูให้ดีอย่าเพิ่งรีบร้อน",
                "ระวังความอารมณ์ร้อนหรือความขุ่นเคืองเล็กๆ น้อยๆ กับคนรัก ควรปรับความเข้าใจกัน",
                "มีเกณฑ์ได้เดินทางไกลร่วมกับคนรัก หรือได้พบมิตรภาพใหม่ที่พัฒนาความสัมพันธ์ได้"
            ]
        };

        // คำนวณราศีตามวันและเดือน
        function getZodiacSign(day, month) {
            const zodiacs = [
                { name: "ราศีมังกร", icon: "♑", startMonth: 1, startDay: 15 },
                { name: "ราศีกุมภ์", icon: "♒", startMonth: 2, startDay: 13 },
                { name: "ราศีมีน", icon: "♓", startMonth: 3, startDay: 15 },
                { name: "ราศีเมษ", icon: "♈", startMonth: 4, startDay: 13 },
                { name: "ราศีพฤษภ", icon: "♉", startMonth: 5, startDay: 15 },
                { name: "ราศีเมถุน", icon: "♊", startMonth: 6, startDay: 15 },
                { name: "ราศีกรกฎ", icon: "♋", startMonth: 7, startDay: 16 },
                { name: "ราศีสิงห์", icon: "♌", startMonth: 8, startDay: 17 },
                { name: "ราศีกันย์", icon: "♍", startMonth: 9, startDay: 17 },
                { name: "ราศีตุลย์", icon: "♎", startMonth: 10, startDay: 18 },
                { name: "ราศีพิจิก", icon: "♏", startMonth: 11, startDay: 16 },
                { name: "ราศีธนู", icon: "♐", startMonth: 12, startDay: 16 }
            ];

            if ((month === 1 && day < 15) || (month === 12 && day >= 16)) return "ราศีธนู ♐";
            if ((month === 1 && day >= 15) || (month === 2 && day < 13)) return "ราศีมังกร ♑";
            if ((month === 2 && day >= 13) || (month === 3 && day < 15)) return "ราศีกุมภ์ ♒";
            if ((month === 3 && day >= 15) || (month === 4 && day < 13)) return "ราศีมีน ♓";
            if ((month === 4 && day >= 13) || (month === 5 && day < 15)) return "ราศีเมษ ♈";
            if ((month === 5 && day >= 15) || (month === 6 && day < 15)) return "ราศีพฤษภ ♉";
            if ((month === 6 && day >= 15) || (month === 7 && day < 16)) return "ราศีเมถุน ♊";
            if ((month === 7 && day >= 16) || (month === 8 && day < 17)) return "ราศีกรกฎ ♋";
            if ((month === 8 && day >= 17) || (month === 9 && day < 17)) return "ราศีสิงห์ ♌";
            if ((month === 9 && day >= 17) || (month === 10 && day < 18)) return "ราศีกันย์ ♍";
            if ((month === 10 && day >= 18) || (month === 11 && day < 16)) return "ราศีตุลย์ ♎";
            if ((month === 11 && day >= 16) || (month === 12 && day < 16)) return "ราศีพิจิก ♏";

            return "ราศีมังกร ♑";
        }

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function predictFortune() {
            const name = document.getElementById('name').value.trim();
            const gender = document.getElementById('gender').value;
            const birthdateInput = document.getElementById('birthdate').value;

            if (!name || !birthdateInput) {
                alert("กรุณากรอกชื่อและเลือกวันเดือนปีเกิดให้ครบถ้วนครับ/ค่ะ");
                return;
            }

            const birthDate = new Date(birthdateInput);
            const day = birthDate.getDate();
            const month = birthDate.getMonth() + 1; // getMonth() เริ่มที่ 0

            // สรุปราศี
            const zodiacSign = getZodiacSign(day, month);

            // แสดงผลลัพธ์
            document.getElementById('resultTitle').innerText = `ดวงชะตาของ คุณ${name} (${gender})`;
            document.getElementById('zodiacBadge').innerText = `${zodiacSign}`;
            document.getElementById('workFortune').innerText = getRandomItem(fortunes.work);
            document.getElementById('moneyFortune').innerText = getRandomItem(fortunes.money);
            document.getElementById('loveFortune').innerText = getRandomItem(fortunes.love);

            document.getElementById('resultCard').style.display = 'block';
        }
    </script>
</body>
</html>
