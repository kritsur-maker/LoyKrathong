<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลอยกระทงออนไลน์</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
            text-align: center;
        }

        /* ส่วนฟอร์มกรอกข้อมูล */
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            margin: 20px 0;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        /* ตัวเลือกกระทงแบบ Radio Visual */
        .krathong-options {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .krathong-item {
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            padding: 10px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .krathong-item img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .krathong-item input {
            display: none;
        }

        .krathong-item.selected {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #f1c40f;
            color: #2c5364;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #f39c12;
            color: #fff;
        }

        /* ส่วนแสดงแม่น้ำและกระทง */
        .river-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, #112d4e, #0f172a);
            overflow: hidden;
            border-top: 2px solid #38bdf8;
            margin-top: auto;
        }

        /* กระทงที่ลอยในน้ำ */
        .floating-krathong {
            position: absolute;
            bottom: -100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatUp 12s linear forwards, sway 3s ease-in-out infinite alternate;
        }

        .floating-krathong img {
            width: 80px;
        }

        .wish-bubble {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 5px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Animation เคลื่อนที่ของกระทง */
        @keyframes floatUp {
            0% {
                bottom: 10px;
                opacity: 1;
                transform: scale(1);
            }
            100% {
                bottom: 280px;
                opacity: 0.2;
                transform: scale(0.4);
            }
        }

        @keyframes sway {
            0% { transform: translateX(-10px); }
            100% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <h1>🌕 ลอยกระทงออนไลน์ 🌕</h1>

    <div class="form-container">
        <!-- 1. เลือกเพศ และกรอกชื่อ -->
        <div class="form-group">
            <label>เพศ / คำนำหน้า:</label>
            <select id="gender">
                <option value="นาย">นาย</option>
                <option value="นางสาว">นางสาว</option>
                <option value="เด็กชาย">เด็กชาย</option>
                <option value="เด็กหญิง">เด็กหญิง</option>
                <option value="">ไม่ระบุ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="username">ชื่อของคุณ:</label>
            <input type="text" id="username" placeholder="กรอกชื่อของคุณ" required>
        </div>

        <!-- 2. เลือกกระทง -->
        <div class="form-group">
            <label>เลือกกระทง:</label>
            <div class="krathong-options">
                <div class="krathong-item selected" onclick="selectKrathong(this, 'https://cdn-icons-png.flaticon.com/512/3507/3507092.png')">
                    <img src="https://cdn-icons-png.flaticon.com/512/3507/3507092.png" alt="กระทงใบตอง">
                    <p>ใบตอง</p>
                </div>
                <div class="krathong-item" onclick="selectKrathong(this, 'https://cdn-icons-png.flaticon.com/512/2619/2619286.png')">
                    <img src="https://cdn-icons-png.flaticon.com/512/2619/2619286.png" alt="กระทงดอกไม้">
                    <p>ดอกไม้</p>
                </div>
                <div class="krathong-item" onclick="selectKrathong(this, 'https://cdn-icons-png.flaticon.com/512/2909/2909763.png')">
                    <img src="https://cdn-icons-png.flaticon.com/512/2909/2909763.png" alt="กระทงแฟนซี">
                    <p>สวรรค์</p>
                </div>
            </div>
        </div>

        <!-- 3. เลือกคำอวยพร -->
        <div class="form-group">
            <label for="wish">เลือกคำอวยพร:</label>
            <select id="wish">
                <option value="ขอให้มีความสุข กายสบายใจ ปราศจากโรคภัย">ขอให้มีความสุข กายสบายใจ ปราศจากโรคภัย</option>
                <option value="ขอให้ลอยความทุกข์ความโศกออกไป เจอแต่สิ่งดีๆ">ขอให้ลอยความทุกข์ความโศกออกไป เจอแต่สิ่งดีๆ</option>
                <option value="ขอให้ร่ำรวย เงินทองไหลมาเทมา การงานรุ่งเรือง">ขอให้ร่ำรวย เงินทองไหลมาเทมา การงานรุ่งเรือง</option>
                <option value="ขอให้เจอความรักที่ดี สมหวังในเรื่องความรัก">ขอให้เจอความรักที่ดี สมหวังในเรื่องความรัก</option>
                <option value="ขอให้สอบผ่าน ได้เกรด A ทุกวิชา!">ขอให้สอบผ่าน ได้เกรด A ทุกวิชา!</option>
            </select>
        </div>

        <button onclick="launchKrathong()">อธิษฐานและลอยกระทง</button>
    </div>

    <!-- ส่วนแม่น้ำ -->
    <div class="river-container" id="river"></div>

    <script>
        let selectedKrathongImg = 'https://cdn-icons-png.flaticon.com/512/3507/3507092.png';

        // ฟังก์ชันเลือกกระทง
        function selectKrathong(element, imgSrc) {
            document.querySelectorAll('.krathong-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedKrathongImg = imgSrc;
        }

        // ฟังก์ชันเมื่อกดลอยกระทง
        function launchKrathong() {
            const gender = document.getElementById('gender').value;
            const nameInput = document.getElementById('username').value.trim();
            const wish = document.getElementById('wish').value;

            if (nameInput === "") {
                alert("กรุณากรอกชื่อของคุณก่อนลอยกระทงครับ/ค่ะ");
                return;
            }

            const fullName = gender ? `${gender}${nameInput}` : nameInput;

            // สร้าง Element กระทงใหม่
            const river = document.getElementById('river');
            const krathongDiv = document.createElement('div');
            krathongDiv.className = 'floating-krathong';

            // สุ่มตำแหน่ง X (ซ้าย-ขวา) บนแม่น้ำ
            const randomX = Math.floor(Math.random() * (window.innerWidth - 120));
            krathongDiv.style.left = `${Math.max(10, randomX)}px`;

            // ใส่เนื้อหาคำอวยพรและรูปกระทง
            krathongDiv.innerHTML = `
                <div class="wish-bubble">
                    <strong>${fullName}</strong><br>
                    "${wish}"
                </div>
                <img src="${selectedKrathongImg}" alt="Krathong">
            `;

            // เพิ่มกระทงลงในแม่น้ำ
            river.appendChild(krathongDiv);

            // ลบ Element ทิ้งเมื่อแอนิเมชันจบลง (12 วินาที)
            setTimeout(() => {
                krathongDiv.remove();
            }, 12000);
        }
    </script>
</body>
</html>
